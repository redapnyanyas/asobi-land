async function resizeData(file){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),k=Math.min(1,240/Math.max(im.width,im.height));cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}

 async function svgImage(element){
  const svg=element.cloneNode(true);
  for(const node of svg.querySelectorAll('image')){
   const href=node.getAttribute('href');
   if(!href||href.startsWith('data:'))continue;
   try{
    const blob=await (await fetch(href)).blob();
    const data=await new Promise((resolve,reject)=>{
     const reader=new FileReader();
     reader.onload=()=>resolve(reader.result);
     reader.onerror=reject;
     reader.readAsDataURL(blob);
    });
    node.setAttribute('href',data);
   }catch(e){}
  }

  const url=URL.createObjectURL(blob),img=new Image();
  try{img.src=url;await img.decode();return img;}
  finally{URL.revokeObjectURL(url);}

 const canvas=document.createElement('canvas');
 canvas.width=700;canvas.height=1200;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#fff7e7';ctx.fillRect(0,0,canvas.width,canvas.height);
 async function paintDecors(side){
  for(const d of decors){
   if((d.layer||initialToppingLayer(d.kind,d.label))!==side)continue;
   const b=scoopAssetBounds();
   const point=typeof d.rx==='number'&&typeof d.ry==='number'?{x:b.x+b.w*d.rx,y:b.y+b.h*d.ry}:null;
   const scene=point?svgToStage(point.x,point.y):decorStagePoint(d);
   const rect=document.getElementById('preview').getBoundingClientRect();
   const x=scene.x/rect.width*canvas.width,y=scene.y/rect.height*canvas.height;
   ctx.save();
   ctx.translate(x,y);
   ctx.rotate((d.rotation||0)*Math.PI/180);
   ctx.scale(d.scale||1,d.scale||1);
   if(d.src){
    const im=new Image();im.src=d.src;
    try{await im.decode();ctx.drawImage(im,-50,-50,100,100)}catch(e){}
   }else{ctx.font='75px serif';ctx.textAlign='center';ctx.fillText(d.emoji,0,27);}
   ctx.restore();
  }

 try{
  ctx.drawImage(await svgImage(document.getElementById('coneBaseSvg')),0,0,700,1200);
  await paintDecors('back');
  ctx.drawImage(await svgImage(document.getElementById('mainIceSvg')),0,0,700,1200);
  await paintDecors('front');
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.87));
  if(!blob)throw Error('Could not produce image');
  const file=new File([blob],'softcream.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file]});
   document.getElementById('toast').textContent='しゃしんを ほぞんしてね';
  }else{
   const url=URL.createObjectURL(blob),anchor=document.createElement('a');
   anchor.href=url;anchor.download='softcream.jpg';anchor.click();
   setTimeout(()=>URL.revokeObjectURL(url),3000);
   document.getElementById('toast').textContent='しゃしんを ダウンロードしたよ';
  }
  savedSignature=signature;beep(900);
 }catch(e){document.getElementById('toast').textContent='ほぞんできなかったよ';console.error(e);}
}
